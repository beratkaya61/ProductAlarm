services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: price_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d price_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    command: npm run start:dev
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      WHATSAPP_ENABLED: "true"
      PRICE_CHECK_INTERVAL_MS: 30000 #180000
      DB_TYPE: postgres
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: supersecret
      DB_DATABASE: price_tracker_db
      DB_SYNCHRONIZE: "true"
      SCRAPER_ENABLED_PROVIDERS: vatan,teknosa,mediamarkt,hepsiburada,trendyol,n11,amazon-tr
      SCRAPER_TIMEOUT_MS: 15000
      SCRAPER_MAX_RESULTS_PER_PROVIDER: 6
      SCRAPER_MAX_TOTAL_RESULTS: 24
      SCRAPER_REQUEST_DELAY_MIN_MS: 900
      SCRAPER_REQUEST_DELAY_MAX_MS: 2400
      WHATSAPP_MESSAGE_DELAY_MS: 1500
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
      - ./backend/src:/app/src
    ports:
      - "5000:5000"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        VITE_API_BASE_URL: http://127.0.0.1:5000
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:5000
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whatsapp_auth:
  postgres_data:
